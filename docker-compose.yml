services:
  relay:
    build: ./relay
    container_name: fuck-exam-relay
    restart: unless-stopped
    # host-сеть: контейнер видит интерфейсы хоста, поэтому на старте
    # автоматически определяется и печатается реальный IP сервера.
    # (в bridge-сети getifaddrs вернул бы внутренний 172.17.x.x)
    network_mode: host
    environment:
      RELAY_PORT: "7444"
      # Сервер за NAT/frp (исходящий IP не равен адресу подключения).
      # Задайте публичный адрес frp-сервера (и порт, если он отличается):
      # RELAY_HOST: "121.5.x.x"
      # RELAY_PUB_PORT: "7444"