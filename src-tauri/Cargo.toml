[package]
name = "fuck-exam"
version = "0.2.0"
description = "FuckExam — запись выбранных окон в видео"
edition = "2021"
default-run = "fuck-exam"

[lib]
name = "fuck_exam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "sync", "macros"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"
jpeg-encoder = "0.6"
dirs = "6"
if-addrs = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["screencast"] }
enumflags2 = "0.7"
gstreamer = "0.24"
gstreamer-video = "0.24"
gstreamer-app = "0.24"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0.1"

[[bin]]
name = "fuck-exam-cli"
path = "src/bin/cli.rs"
