[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vm-guard"
version = "0.1.0"
description = "Safe focus-loss automation around VirtualBox VM windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vm-guard = "vm_guard.cli:main"

[project.optional-dependencies]
guest-input = ["virtualbox>=2.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
