name: build

# CI + atomic release:
#   * push в master — сборки и проверки без релиза
#   * push тега v* — все архитектурные сборки, затем один GitHub Release
#   * workflow_dispatch — сборки без релиза

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/quadrotez/fuck-exam-relay

jobs:
  # Tauri desktop: Linux x86_64 + ARM64.
  # ARMv7 не включён: WebKitGTK/Tauri GUI cross-build для ARMv7 требует
  # отдельного sysroot и не является стандартной desktop-целью.
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            deb_arch: amd64
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libunwind-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check target architecture
        run: |
          uname -m
          dpkg --print-architecture
          rustc -vV | grep '^host:'
          echo "target=${{ matrix.target }}"

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION=$(sed -n 's/^version = "\([^\"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$APP_VERSION" = "$TAG_VERSION" || { echo "Version mismatch: Cargo.toml=$APP_VERSION, tag=$TAG_VERSION"; exit 1; }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: linux-${{ matrix.arch }}

      - name: Install Tauri CLI
        run: |
          rm -f "$HOME/.cargo/bin/cargo-tauri"
          cargo install tauri-cli --locked --force

      - name: Clean cached application target
        run: rm -rf src-tauri/target

      - name: Compile Linux client
        run: cargo build --release --locked --target "${{ matrix.target }}" --manifest-path src-tauri/Cargo.toml

      - name: Bundle Linux client (deb + AppImage)
        env:
          NO_STRIP: "1"
        run: |
          cd src-tauri
          cargo tauri bundle --target "${{ matrix.target }}" --bundles deb,appimage --ci

      - name: Stage Linux artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="$(sed -n 's/^version = "\([^\"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          BUILD_DIR="src-tauri/target/${{ matrix.target }}/release"
          mkdir -p release-artifacts
          cp "$BUILD_DIR"/bundle/deb/*.deb release-artifacts/
          cp "$BUILD_DIR"/bundle/appimage/*.AppImage release-artifacts/
          cp "$BUILD_DIR/fuck-exam" "release-artifacts/fuck-exam-linux-${{ matrix.arch }}-${VERSION}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuck-exam-linux-${{ matrix.arch }}
          path: release-artifacts/

  # Relay: Linux x86_64, ARM64 and ARMv7.
  build-relay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cross: false
          - arch: armv7
            target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-24.04
            cross: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./relay -> target"
          key: relay-${{ matrix.arch }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build relay natively
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target "${{ matrix.target }}" --manifest-path relay/Cargo.toml
      - name: Test relay natively
        if: ${{ !matrix.cross }}
        run: cargo test --release --locked --target "${{ matrix.target }}" --manifest-path relay/Cargo.toml
      - name: Build relay with cross
        if: matrix.cross
        run: cross build --release --locked --target "${{ matrix.target }}" --manifest-path relay/Cargo.toml
      - name: Stage relay artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="$(sed -n 's/^version = "\([^\"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          mkdir -p release-artifacts
          cp "relay/target/${{ matrix.target }}/release/fuck-exam-relay" "release-artifacts/fuck-exam-relay-linux-${{ matrix.arch }}-${VERSION}"
      - name: Upload relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuck-exam-relay-${{ matrix.arch }}
          path: release-artifacts/

  # Multi-architecture relay image: amd64, arm64 and arm/v7.
  docker-image:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="ci-${GITHUB_RUN_NUMBER}"
          echo "tags=${{ env.GHCR_IMAGE }}:${VERSION},${{ env.GHCR_IMAGE }}:latest" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-architecture relay image
        uses: docker/build-push-action@v6
        with:
          context: ./relay
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.ver.outputs.tags }}

  # Windows desktop: x64 + ARM64.
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            ffmpeg: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            ffmpeg: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install FFmpeg runtime
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "${{ matrix.ffmpeg }}" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe was not found in downloaded archive" }
          Copy-Item $exe.FullName src-tauri/ffmpeg.exe
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-${{ matrix.arch }}
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --force
      - name: Check Windows client
        run: cargo check --locked --target "${{ matrix.target }}" --manifest-path src-tauri/Cargo.toml
      - name: Build NSIS installer
        working-directory: src-tauri
        run: cargo tauri build --target "${{ matrix.target }}" --bundles nsis --ci
      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          if (-not $version) { $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value }
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/fuck-exam.exe" "release-artifacts/fuck-exam-windows-${{ matrix.arch }}.exe"
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $installer.FullName "release-artifacts/FuckExam_${version}_${{ matrix.arch }}-setup.exe"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuck-exam-windows-${{ matrix.arch }}
          path: release-artifacts/

  # Release is created only after every architecture/platform job succeeds.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-relay, build-windows, docker-image]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fuck-exam-*
          path: release-artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-artifacts/* \
            --repo "${{ github.repository }}" \
            --title "FuckExam ${{ github.ref_name }}" \
            --generate-notes
