  #     - uses: actions/checkout@v4
  #     - name: Setup Rust
  #       uses: dtolnay/rust-toolchain@stable
  #     - name: Cache cargo
  #       uses: Swatinem/rust-cache@v2
  #       with:
  #         workspaces: "./src-tauri -> target"
