name: build

# CI + авторелиз в одном файле:
#   * push в master — собираем и тестируем (без релиза)
#   * push тега v* — собираем, публикуем GitHub Release
#     (deb + AppImage + бинарник для записывающего + бинарник relay)
#     и пушим relay-образ в GHCR (ghcr.io/quadrotez/fuck-exam-relay)
#   * workflow_dispatch — сборка без релиза

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/quadrotez/fuck-exam-relay

jobs:
  # Linux: .deb + .AppImage + бинарник записывающего
  build-linux:
    # Build on an older glibc baseline so AppImage also works on older distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libunwind-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check target architecture and libc baseline
        run: |
          uname -m
          dpkg --print-architecture
          ldd --version | head -1
          rustc -vV | grep '^host:'

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION=$(sed -n 's/^version = "\([^\"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$APP_VERSION" = "$TAG_VERSION" || {
            echo "Version mismatch: Cargo.toml=$APP_VERSION, tag=$TAG_VERSION"
            exit 1
          }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install tauri-cli
        # Build the CLI on Jammy instead of downloading a newer GLIBC-linked binary.
        run: |
          rm -f "$HOME/.cargo/bin/cargo-tauri"
          cargo install tauri-cli --locked --force

      - name: Compile Linux client
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Bundle Linux client (deb + AppImage)
        env:
          # linuxdeploy тянет устаревший strip, который падает на .relr.dyn (новые дистры)
          NO_STRIP: "1"
        run: |
          (cd src-tauri && cargo tauri bundle --bundles deb,appimage --ci)

      - name: Stage artifacts
        id: ver
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release-artifacts
          cp src-tauri/target/release/bundle/deb/*.deb release-artifacts/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-artifacts/
          cp src-tauri/target/release/fuck-exam "release-artifacts/fuck-exam-linux-x86_64-glibc-2.35-${VERSION}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuck-exam-linux
          path: release-artifacts/


  # Relay-сервер: бинарник + тесты
  build-relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./relay -> target"

      - name: Build relay
        run: cargo build --release --manifest-path relay/Cargo.toml

      - name: Test relay
        run: cargo test --release --manifest-path relay/Cargo.toml

      - name: Stage artifact
        id: ver
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          mkdir -p release-artifacts
          cp relay/target/release/fuck-exam-relay "release-artifacts/fuck-exam-relay-linux-x86_64-${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuck-exam-relay-linux
          path: release-artifacts/


  # relay-контейнер в GHCR для сервера (docker compose pull)
  docker-image:
    runs-on: ubuntu-24.04
    # пушим образ только на тегах и по ручному запуску,
    # в master-CI копилка образов не нужна
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags
        id: ver
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="ci-${{ github.run_number }}"
          fi
          {
            echo "tags<<EOF"
            echo "${{ env.GHCR_IMAGE }}:${VERSION}"
            if [[ "${{ github.ref_name }}" == v* ]]; then
              echo "${{ env.GHCR_IMAGE }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push relay image
        uses: docker/build-push-action@v6
        with:
          context: ./relay
          push: true
          tags: ${{ steps.ver.outputs.tags }}

  # Windows-клиент: только Tauri-приложение и Windows Graphics Capture.
  # relay остаётся Linux/Docker-сервисом и намеренно сюда не входит.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install FFmpeg runtime
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          Copy-Item (Get-Command ffmpeg).Source src-tauri/ffmpeg.exe
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Check Windows client
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build NSIS installer
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis
      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Copy-Item src-tauri/target/release/fuck-exam.exe release-artifacts/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-artifacts/
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuck-exam-windows
          path: release-artifacts/

  # Release is created only after every platform build and relay image succeeds.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-relay, build-windows, docker-image]
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fuck-exam-*
          path: release-artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-artifacts/* \
            --repo "${{ github.repository }}" \
            --title "FuckExam ${{ github.ref_name }}" \
            --generate-notes
