  #       shell: bash
  #       run: |
  #         mkdir -p release-artifacts
  #         cp src-tauri/target/release/fuck-exam.exe release-artifacts/
  #         (cd src-tauri && cargo tauri build --bundles nsis)
  #         cp src-tauri/target/release/bundle/nsis/*.exe release-artifacts/
