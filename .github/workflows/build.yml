name: build

# CI + авторелиз в одном файле:
#   * push в master — собираем и тестируем (без релиза)
#   * push тега v* — собираем, публикуем GitHub Release
#     (deb + AppImage + бинарник для записывающего + бинарник relay)
#     и пушим relay-образ в GHCR (ghcr.io/quadrotez/fuck-exam-relay)
#   * workflow_dispatch — сборка без релиза

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/quadrotez/fuck-exam-relay

jobs:
  # Linux: .deb + .AppImage + бинарник записывающего
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build bundles (deb + AppImage)
        env:
          # linuxdeploy тянет устаревший strip, который падает на .relr.dyn (новые дистры)
          NO_STRIP: "1"
        run: |
          (cd src-tauri && cargo tauri build --bundles deb,appimage)

      - name: Stage artifacts
        id: ver
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release-artifacts
          cp src-tauri/target/release/bundle/deb/*.deb release-artifacts/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-artifacts/
          cp src-tauri/target/release/fuck-exam "release-artifacts/fuck-exam-linux-x86_64-${VERSION}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuck-exam-linux
          path: release-artifacts/

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-artifacts/*

  # Relay-сервер: бинарник + тесты
  build-relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./relay -> target"

      - name: Build relay
        run: cargo build --release --manifest-path relay/Cargo.toml

      - name: Test relay
        run: cargo test --release --manifest-path relay/Cargo.toml

      - name: Stage artifact
        id: ver
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          mkdir -p release-artifacts
          cp relay/target/release/fuck-exam-relay "release-artifacts/fuck-exam-relay-linux-x86_64-${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuck-exam-relay-linux
          path: release-artifacts/

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-artifacts/*

  # relay-контейнер в GHCR для сервера (docker compose pull)
  docker-image:
    runs-on: ubuntu-24.04
    # пушим образ только на тегах и по ручному запуску,
    # в master-CI копилка образов не нужна
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags
        id: ver
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="ci-${{ github.run_number }}"
          fi
          {
            echo "tags<<EOF"
            echo "${{ env.GHCR_IMAGE }}:${VERSION}"
            if [[ "${{ github.ref_name }}" == v* ]]; then
              echo "${{ env.GHCR_IMAGE }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push relay image
        uses: docker/build-push-action@v6
        with:
          context: ./relay
          push: true
          tags: ${{ steps.ver.outputs.tags }}

  # Windows (.exe) понадобится после добавления Windows-бэкенда захвата.
  # Раскомментируй, когда захват под Windows будет реализован:
