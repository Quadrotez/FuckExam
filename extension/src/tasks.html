<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задания МЭШ</title>
  <link rel="stylesheet" href="tasks.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">МЭШ</p>
      <h1>Все задания</h1>
      <p id="source" class="muted">Источник не выбран</p>
    </div>
    <div class="actions">
      <button id="rescan" class="button secondary">Сканировать снова</button>
      <button id="clear" class="button ghost">Очистить</button>
    </div>
  </header>
  <main>
    <section class="toolbar">
      <input id="search" type="search" placeholder="Поиск по заданиям, предметам и материалам…" autocomplete="off">
      <select id="status">
        <option value="all">Все статусы</option>
        <option value="new">Новые</option>
        <option value="done">Выполненные</option>
      </select>
    </section>
    <div id="notice" class="notice" hidden></div>
    <section id="stats" class="stats" aria-live="polite"></section>
    <section id="tasks" class="task-grid" aria-live="polite"></section>
  </main>
  <template id="task-template">
    <article class="task-card">
      <div class="task-head"><span class="subject"></span><span class="due-date"></span></div>
      <h2 class="title"></h2>
      <p class="description"></p>
      <div class="materials"></div>
      <a class="source-link" target="_blank" rel="noreferrer">Открыть на МЭШ</a>
    </article>
  </template>
  <script src="tasks.js"></script>
</body>
</html>
