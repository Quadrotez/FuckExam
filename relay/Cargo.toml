[package]
name = "fuck-exam-relay"
version = "0.1.0"
description = "FuckExam relay — пересылка трансляции между комнатами по WebSocket"
edition = "2021"

[lib]
name = "fuck_exam_relay"
path = "src/lib.rs"

[[bin]]
name = "fuck-exam-relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"